{% extends "base.html" %}
{% block title %}Spiel – Spielzeitmanager{% endblock %}
{% block content %}
<div x-data="gameApp({{ game_id }})" x-init="init()" x-cloak>

  <!-- Header -->
  <div class="flex items-center gap-3 mb-4">
    <a href="/games" class="text-green-700 text-lg">‹</a>
    <div>
      <h2 class="text-xl font-bold" x-text="game ? game.opponent : '…'"></h2>
      <div class="text-sm text-gray-500" x-text="game ? formatDate(game.date) : ''"></div>
    </div>
    <div class="ml-auto">
      <span class="text-xs px-2 py-1 rounded-full font-medium"
            :class="statusClass(game?.status)"
            x-text="statusLabel(game?.status)"></span>
    </div>
  </div>

  <!-- Timer -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-4 text-center">
    <div class="text-6xl font-mono font-bold tracking-tight mb-1"
         :class="isRunning ? 'text-green-700' : 'text-gray-400'"
         x-text="formatTime(displaySeconds)"></div>
    <div class="text-sm text-gray-400 mb-1">
      <span x-text="halfLabel(game?.status)"></span>
      <span x-show="fairShare > 0"> · Fair Share: <span x-text="formatTime(fairShare)"></span></span>
    </div>
    <!-- Progress bar for overall game time -->
    <div class="h-2 bg-gray-100 rounded-full overflow-hidden mt-3">
      <div class="h-full bg-green-500 rounded-full progress-bar"
           :style="`width: ${Math.min(displaySeconds / gameLength * 100, 100)}%`"></div>
    </div>
    <div class="text-xs text-gray-400 mt-1">Spielzeit gesamt</div>
  </div>

  <!-- Control buttons -->
  <div class="flex gap-2 mb-4">

    <!-- Setup: Start button -->
    <template x-if="game?.status === 'setup'">
      <button @click="startFirstHalf()"
              class="btn-tap flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl text-lg shadow transition-colors">
        ▶ 1. Halbzeit starten
      </button>
    </template>

    <!-- Running first half -->
    <template x-if="game?.status === 'first_half'">
      <button @click="pauseGame()"
              class="btn-tap flex-1 bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-4 rounded-xl text-lg shadow transition-colors">
        ⏸ Pause
      </button>
    </template>

    <!-- Paused first half -->
    <template x-if="game?.status === 'paused_first'">
      <div class="flex gap-2 flex-1">
        <button @click="pauseGame()"
                class="btn-tap flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow transition-colors">
          ▶ Weiter
        </button>
        <button @click="startSecondHalf()"
                class="btn-tap flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow transition-colors">
          ▶▶ 2. HZ
        </button>
      </div>
    </template>

    <!-- Running second half -->
    <template x-if="game?.status === 'second_half'">
      <button @click="pauseGame()"
              class="btn-tap flex-1 bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-4 rounded-xl text-lg shadow transition-colors">
        ⏸ Pause
      </button>
    </template>

    <!-- Paused second half -->
    <template x-if="game?.status === 'paused_second'">
      <div class="flex gap-2 flex-1">
        <button @click="pauseGame()"
                class="btn-tap flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow transition-colors">
          ▶ Weiter
        </button>
        <button @click="finishGame()"
                class="btn-tap flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow transition-colors">
          ■ Beenden
        </button>
      </div>
    </template>

    <!-- Finished -->
    <template x-if="game?.status === 'finished'">
      <div class="flex-1 text-center text-gray-500 font-semibold py-4">
        Spiel beendet
      </div>
    </template>

  </div>

  <!-- Squad size hint (setup only) -->
  <template x-if="game?.status === 'setup'">
    <div class="text-center text-sm mb-3"
         :class="assignedCount === requiredCount ? 'text-green-700 font-semibold' : 'text-gray-400'">
      <span x-text="assignedCount"></span>/<span x-text="requiredCount"></span> Positionen besetzt
      <span x-show="assignedCount !== requiredCount" class="text-orange-500">
        – bitte alle Positionen (inkl. Torhüter) besetzen
      </span>
    </div>
  </template>

  <!-- Pitch -->
  <div class="pitch-bg rounded-2xl shadow-sm p-4 mb-4">
    <template x-for="(row, ri) in pitchRows" :key="ri">
      <div class="flex justify-center gap-2 mb-3 last:mb-0">
        <template x-for="slot in row" :key="`${slot.line}-${slot.index}`">
          <div @click="openPicker(slot.line, slot.index)"
               class="btn-tap w-16 h-16 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer select-none shadow transition-colors"
               :class="slotClass(slot)">
            <template x-if="slot.player">
              <div class="px-1 overflow-hidden w-full">
                <div class="text-[11px] font-bold leading-tight truncate" x-text="slot.player.name"></div>
                <div class="text-[10px] opacity-80"
                     x-text="formatTime(slot.line === 0 ? slot.player.gk_seconds : slot.player.played_seconds)"></div>
              </div>
            </template>
            <template x-if="!slot.player">
              <div class="text-white/70 text-2xl leading-none">+</div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- Bench -->
  <div class="mb-4">
    <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Bank</div>
    <div class="flex flex-wrap gap-2">
      <template x-for="p in benchPlayers" :key="p.player_id">
        <div class="px-3 py-2 rounded-lg bg-white border border-gray-100 shadow-sm text-sm">
          <span class="font-medium" x-text="p.name"></span>
        </div>
      </template>
      <div x-show="benchPlayers.length === 0" class="text-gray-400 text-sm">Bank ist leer.</div>
    </div>
  </div>

  <!-- Progress list -->
  <ul class="space-y-2">
    <template x-for="p in sortedPlayers" :key="p.player_id">
      <li class="flex items-center gap-3 rounded-xl px-4 py-3 shadow-sm border transition-all"
          :class="playerCardClass(p)">

        <!-- Status dot -->
        <div class="w-3 h-3 rounded-full flex-shrink-0"
             :class="p.on_field ? 'bg-green-500' : 'bg-gray-300'"></div>

        <!-- Name -->
        <div class="flex-1 min-w-0">
          <div class="font-semibold truncate">
            <span x-text="p.name"></span>
            <span x-show="p.slot_line === 0" class="text-xs font-normal text-yellow-600 ml-1">TW</span>
          </div>
          <div class="text-xs text-gray-400">
            <span x-text="formatTime(p.played_seconds)"></span>
            <span x-show="p.gk_seconds > 0"> · TW: <span x-text="formatTime(p.gk_seconds)"></span></span>
          </div>
        </div>

        <!-- Progress bar -->
        <div class="w-28 flex-shrink-0">
          <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
            <div class="h-full rounded-full transition-all duration-1000"
                 :class="progressColor(p)"
                 :style="`width: ${progressPct(p)}%`"></div>
          </div>
          <div class="text-xs text-right mt-0.5"
               :class="progressColor(p).replace('bg-', 'text-')"
               x-text="`${Math.round(progressPct(p))}%`"></div>
        </div>

      </li>
    </template>
  </ul>

  <!-- Slot picker -->
  <div x-show="pickerOpen" x-transition
       class="fixed inset-0 bg-black/50 z-40 flex items-end sm:items-center justify-center"
       @click.self="closePicker()">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-sm max-h-[70vh] overflow-y-auto p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold" x-text="pickerLine === 0 ? 'Torhüter wählen' : 'Spieler wählen'"></h3>
        <button @click="closePicker()" class="text-gray-400 text-xl leading-none px-2">&times;</button>
      </div>
      <ul class="space-y-2">
        <template x-for="p in benchPlayers" :key="p.player_id">
          <li @click="pickPlayer(p.player_id)"
              class="btn-tap flex items-center justify-between rounded-lg px-3 py-2 bg-gray-50 hover:bg-green-50 cursor-pointer">
            <span class="font-medium" x-text="p.name"></span>
            <span class="text-xs text-gray-400" x-text="formatTime(p.played_seconds)"></span>
          </li>
        </template>
        <li x-show="benchPlayers.length === 0" class="text-gray-400 text-sm text-center py-4">
          Keine Spieler auf der Bank.
        </li>
      </ul>
      <button x-show="game?.status === 'setup' && currentSlotPlayer"
              @click="removeFromSlot()"
              class="btn-tap w-full mt-3 text-red-500 text-sm font-medium py-2 rounded-lg hover:bg-red-50">
        Spieler von Position entfernen
      </button>
    </div>
  </div>

</div>

<style>
  .pitch-bg {
    background: repeating-linear-gradient(
      to bottom,
      #16a34a 0, #16a34a 40px,
      #15803d 40px, #15803d 80px
    );
    border: 2px solid rgba(255,255,255,0.4);
  }
</style>
{% endblock %}

{% block scripts %}
<script>
function gameApp(gameId) {
  return {
    game: null,
    players: [],
    fairShare: 0,
    displaySeconds: 0,
    pickerOpen: false,
    pickerLine: null,
    pickerIndex: null,
    _tickInterval: null,
    _pollInterval: null,
    _localStart: null,       // performance.now() when current period started (client-side)
    _secsAtPeriodStart: 0,   // game seconds at start of current running period

    get isRunning() {
      return this.game?.status === 'first_half' || this.game?.status === 'second_half';
    },
    get gameLength() {
      return (this.game?.half_length_seconds || 1500) * 2;
    },
    get assignedCount() {
      return this.players.filter(p => p.slot_line !== null).length;
    },
    get requiredCount() {
      return (this.game?.field_players || 0) + 1;
    },
    get benchPlayers() {
      return this.players.filter(p => p.slot_line === null).sort((a, b) => a.name.localeCompare(b.name));
    },
    get sortedPlayers() {
      return [...this.players].sort((a, b) => a.name.localeCompare(b.name));
    },
    get pitchRows() {
      if (!this.game) return [];
      const lines = this.game.formation_lines || [];
      const rows = [];
      for (let i = lines.length; i >= 1; i--) {
        const count = lines[i - 1];
        const slots = [];
        for (let idx = 0; idx < count; idx++) {
          slots.push({ line: i, index: idx, player: this._findSlot(i, idx) });
        }
        rows.push(slots);
      }
      rows.push([{ line: 0, index: 0, player: this._findSlot(0, 0) }]);
      return rows;
    },
    get currentSlotPlayer() {
      if (this.pickerLine === null) return null;
      return this._findSlot(this.pickerLine, this.pickerIndex);
    },

    _findSlot(line, index) {
      return this.players.find(p => p.slot_line === line && p.slot_index === index) || null;
    },

    async init() {
      await this.fetchState();
      this._pollInterval = setInterval(() => this.fetchState(), 10000);
    },

    async fetchState() {
      try {
        const r = await fetch(`/api/games/${gameId}/state`);
        if (!r.ok) return;
        const data = await r.json();
        this._applyState(data);
      } catch(e) { /* offline – timer keeps running locally */ }
    },

    _applyState(data) {
      this.game = data.game;
      this.players = data.players;
      this.fairShare = data.fair_share_seconds;
      this._secsAtPeriodStart = data.game.game_seconds_at_period_start;

      if (this.isRunning && data.game.period_started_at) {
        // Sync client clock to server
        const serverNow = data.game.game_seconds;
        this._secsAtPeriodStart = this._secsAtPeriodStart;
        const drift = serverNow - this._secsAtPeriodStart;
        this._localStart = performance.now() - drift * 1000;
        this.displaySeconds = serverNow;
        this._startTick();
      } else {
        this._stopTick();
        this.displaySeconds = data.game.game_seconds;
      }
    },

    _startTick() {
      if (this._tickInterval) return;
      this._tickInterval = setInterval(() => {
        const elapsed = (performance.now() - this._localStart) / 1000;
        const secs = this._secsAtPeriodStart + elapsed;

        // Auto-stop at half boundaries
        const halfLength = this.game?.half_length_seconds || 1500;
        const halfEnd = this.game?.status === 'first_half' ? halfLength : halfLength * 2;
        if (secs >= halfEnd) {
          this.displaySeconds = halfEnd;
          this._stopTick();
          if (this.game?.status === 'first_half') {
            this._autoEndFirstHalf();
          } else {
            this._autoEndGame();
          }
          return;
        }
        this.displaySeconds = secs;
      }, 500);
    },

    _stopTick() {
      if (this._tickInterval) {
        clearInterval(this._tickInterval);
        this._tickInterval = null;
      }
    },

    async _autoEndFirstHalf() {
      try {
        const r = await fetch(`/api/games/${gameId}/pause`, {method:'POST'});
        if (r.ok) await this.fetchState();
      } catch(e) {}
    },

    async _autoEndGame() {
      try {
        const r = await fetch(`/api/games/${gameId}/finish`, {method:'POST'});
        if (r.ok) await this.fetchState();
      } catch(e) {}
    },

    // ── Slot picker / substitution ──────────────────────────────────────

    openPicker(line, index) {
      if (!this.game || this.game.status === 'finished') return;
      this.pickerLine = line;
      this.pickerIndex = index;
      this.pickerOpen = true;
    },
    closePicker() {
      this.pickerOpen = false;
    },
    async pickPlayer(playerId) {
      const r = await fetch(`/api/games/${gameId}/assign-slot`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ slot_line: this.pickerLine, slot_index: this.pickerIndex, player_id: playerId })
      });
      if (r.ok) {
        this.pickerOpen = false;
        await this.fetchState();
      } else {
        const err = await r.json().catch(() => ({}));
        alert(err.error || 'Fehler beim Zuweisen.');
      }
    },
    async removeFromSlot() {
      const occupant = this.currentSlotPlayer;
      if (!occupant) return;
      const r = await fetch(`/api/games/${gameId}/unassign-slot`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ player_id: occupant.player_id })
      });
      if (r.ok) {
        this.pickerOpen = false;
        await this.fetchState();
      }
    },

    // ── Game control ────────────────────────────────────────────────────

    async startFirstHalf() {
      if (this.assignedCount !== this.requiredCount) {
        alert(`Bitte alle ${this.requiredCount} Positionen (inkl. Torhüter) besetzen.`);
        return;
      }
      const r = await fetch(`/api/games/${gameId}/start`, {method:'POST'});
      if (r.ok) {
        this._localStart = performance.now();
        await this.fetchState();
      }
    },

    async startSecondHalf() {
      const r = await fetch(`/api/games/${gameId}/start-second-half`, {method:'POST'});
      if (r.ok) {
        this._localStart = performance.now();
        await this.fetchState();
      }
    },

    async pauseGame() {
      const r = await fetch(`/api/games/${gameId}/pause`, {method:'POST'});
      if (r.ok) await this.fetchState();
    },

    async finishGame() {
      if (!confirm('Spiel wirklich beenden?')) return;
      const r = await fetch(`/api/games/${gameId}/finish`, {method:'POST'});
      if (r.ok) await this.fetchState();
    },

    // ── Display helpers ─────────────────────────────────────────────────

    formatTime(secs) {
      if (!secs && secs !== 0) return '00:00';
      const s = Math.floor(secs);
      const m = Math.floor(s / 60);
      const ss = s % 60;
      return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    },
    formatDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'});
    },
    halfLabel(status) {
      return {setup:'Aufstellung', first_half:'1. Halbzeit', paused_first:'Halbzeitpause', second_half:'2. Halbzeit', paused_second:'Pause', finished:'Abpfiff'}[status] || '';
    },
    statusLabel(status) {
      return {setup:'Vorbereitung', first_half:'1. HZ ▶', paused_first:'Pause', second_half:'2. HZ ▶', paused_second:'Pause', finished:'Beendet'}[status] || '';
    },
    statusClass(status) {
      if (status === 'finished') return 'bg-gray-100 text-gray-500';
      if (status === 'setup') return 'bg-blue-100 text-blue-700';
      if (status?.includes('paused')) return 'bg-yellow-100 text-yellow-700';
      return 'bg-green-100 text-green-700';
    },

    progressPct(p) {
      if (!p.fair_share_seconds || p.fair_share_seconds === 0) return 0;
      return Math.min((p.played_seconds / p.fair_share_seconds) * 100, 100);
    },
    progressColor(p) {
      const pct = this.progressPct(p);
      if (pct >= 100) return 'bg-green-500';
      if (pct >= 60) return 'bg-blue-400';
      return 'bg-orange-400';
    },
    playerCardClass(p) {
      if (this.game?.status === 'finished') return 'bg-white border-gray-100';
      if (p.on_field) return 'bg-green-50 border-green-200';
      return 'bg-white border-gray-100';
    },
    slotClass(slot) {
      if (this.game?.status === 'finished') {
        return slot.player ? 'bg-white/90 border-2 border-white/40 text-gray-700' : 'bg-white/10 border-2 border-dashed border-white/30';
      }
      if (!slot.player) return 'bg-white/15 border-2 border-dashed border-white/60 hover:bg-white/25 text-white';
      if (slot.line === 0) return 'bg-yellow-400 border-2 border-yellow-100 text-yellow-950 hover:bg-yellow-300';
      return 'bg-white border-2 border-white text-gray-800 hover:bg-green-50';
    },
  }
}
</script>
{% endblock %}
